<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>MathGamesLab</title>
<style>
body{
  margin:0;
  font-family:"Yu Gothic",sans-serif;
  background:linear-gradient(#7ec8ff,#fff4d6);
  text-align:center;
  padding:50px 20px;
}
h1{
  font-size:48px;
}
.card{
  display:inline-block;
  width:260px;
  margin:18px;
  padding:24px;
  background:white;
  border-radius:22px;
  box-shadow:0 6px 18px rgba(0,0,0,.18);
}
a{
  text-decoration:none;
  color:#111;
}
.button{
  margin-top:12px;
  padding:10px 20px;
  background:#2563eb;
  color:white;
  border-radius:999px;
  font-weight:bold;
}
</style>
</head>
<body>

<h1>🎮 MathGamesLab</h1>
<p>数学ゲームセンター</p>

<a href="https://mathgameslab.github.io/square-shot/">
  <div class="card">
    <h2>🎈 SQUARE SHOT</h2>
    <p>平方数を見抜け！</p>
    <div class="button">PLAY</div>
  </div>
</a>

<a href="https://mathgameslab.github.io/prime-shot/">
  <div class="card">
    <h2>⭐ PRIME SHOT</h2>
    <p>素数を見抜け！</p>
    <div class="button">PLAY</div>
  </div>
</a>

</body>
</html>
